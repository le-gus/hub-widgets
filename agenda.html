<!DOCTYPE html>
<html>
<head>
<style>
  html, body { margin:0; padding:0; width:520px; }
  body {
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: #f0f6fb;
    padding: 20px;
    box-sizing: border-box;
  }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day { background: #ffffff; border: 1px solid #dce8f2; border-radius: 6px; padding: 8px 6px; min-height: 90px; }
  .day.today { border-color: #2b6cb0; border-width: 2px; }
  .dname { font-size: 9px; color: #6b8caa; text-transform: uppercase; letter-spacing: 0.4px; }
  .dnum { font-size: 15px; font-weight: 700; color: #1e3a52; margin-bottom: 6px; }
  .evt { background: #dbe9f7; color: #2b6cb0; font-size: 9px; padding: 3px 4px; border-radius: 3px; margin-bottom: 3px; line-height: 1.25; }
  .evt.alt { background: #e4dbf7; color: #6b3fa0; }
  .evt.busy { background: #f2e6d0; color: #8a6a2a; }
  .evt.med { background: #f7dbdb; color: #a3402f; }
</style>
</head>
<body>
  <div class="week">
    <div class="day today"><div class="dname">Sáb</div><div class="dnum">29</div><div class="evt alt">Aniversário da sobrinha (tentativo)</div></div>
    <div class="day"><div class="dname">Dom</div><div class="dnum">30</div></div>
    <div class="day"><div class="dname">Seg</div><div class="dnum">31</div><div class="evt">12:00 Boxe</div><div class="evt alt">19:00 Terapia</div><div class="evt busy">16:30 Ocupado (Omie)</div><div class="evt busy">20:00 Ocupado (Omie)</div></div>
    <div class="day"><div class="dname">Ter</div><div class="dnum">01</div><div class="evt busy">12:00 Ocupado (Omie)</div><div class="evt busy">15:00 Ocupado (Omie)</div></div>
    <div class="day"><div class="dname">Qua</div><div class="dnum">02</div><div class="evt">09:00 Cancelar assinatura Audible</div><div class="evt">12:00 Boxe</div><div class="evt busy">09:00 Ocupado (Omie)</div></div>
    <div class="day"><div class="dname">Qui</div><div class="dnum">03</div></div>
    <div class="day"><div class="dname">Sex</div><div class="dnum">04</div><div class="evt">12:00 Boxe</div><div class="evt busy">09:00 Ocupado (Omie)</div></div>
  </div>
</body>
</html>
